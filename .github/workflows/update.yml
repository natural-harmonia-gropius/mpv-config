name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/workflows/update/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/workflows/update

      - name: Update files
        run: node .github/workflows/update/script.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Stage and check changes
        id: changes
        shell: bash
        run: |
          git add --all -- portable_config

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: update files"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
